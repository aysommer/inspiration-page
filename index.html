<!DOCTYPE html>
<html lang="en" data-design="apple">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <meta name="theme-color" content="#f5f5f7">
      <title>Inspiration</title>
      <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
      <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png">
      <link rel="preload" href="/node_modules/@fontsource/google-sans/files/google-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
      <link rel="preload" href="/node_modules/@fontsource/google-sans/files/google-sans-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
      <script src="/design-init.js"></script>
   </head>
   <body class="min-h-dvh bg-base-200 text-base-content antialiased">
      <div class="drawer drawer-end">
         <input id="settings-drawer" type="checkbox" class="drawer-toggle">

         <div class="drawer-content relative flex min-h-dvh flex-col">
            <div class="ambient pointer-events-none absolute inset-0 -z-0"></div>

            <header class="relative z-10 flex items-center justify-between px-6 py-5">
               <span class="brand">Inspiration</span>
               <label for="settings-drawer" aria-label="Open settings" class="icon-btn">
                  <svg viewBox="0 0 24 24" class="only-apple size-[22px]" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round">
                     <path fill-rule="evenodd" d="M10.19 5.24L10.63 2.80A9.3 9.3 0 0 1 13.37 2.80L13.81 5.24A7.0 7.0 0 0 1 15.50 5.94L17.53 4.52A9.3 9.3 0 0 1 19.48 6.47L18.06 8.50A7.0 7.0 0 0 1 18.76 10.19L21.20 10.63A9.3 9.3 0 0 1 21.20 13.37L18.76 13.81A7.0 7.0 0 0 1 18.06 15.50L19.48 17.53A9.3 9.3 0 0 1 17.53 19.48L15.50 18.06A7.0 7.0 0 0 1 13.81 18.76L13.37 21.20A9.3 9.3 0 0 1 10.63 21.20L10.19 18.76A7.0 7.0 0 0 1 8.50 18.06L6.47 19.48A9.3 9.3 0 0 1 4.52 17.53L5.94 15.50A7.0 7.0 0 0 1 5.24 13.81L2.80 13.37A9.3 9.3 0 0 1 2.80 10.63L5.24 10.19A7.0 7.0 0 0 1 5.94 8.50L4.52 6.47A9.3 9.3 0 0 1 6.47 4.52L8.50 5.94A7.0 7.0 0 0 1 10.19 5.24ZM15.4 12A3.4 3.4 0 1 0 8.6 12A3.4 3.4 0 1 0 15.4 12Z"/>
                  </svg>
                  <svg viewBox="0 0 24 24" class="only-google size-6" fill="currentColor">
                     <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
                  </svg>
                  <svg viewBox="0 0 24 24" class="only-microsoft size-5" fill="currentColor">
                     <path d="M12.01 2.25q1.11.01 2.18.25c.32.07.55.33.59.65l.17 1.53a1.38 1.38 0 0 0 1.92 1.11l1.4-.61c.3-.13.64-.06.85.17a10 10 0 0 1 2.2 3.8c.1.3 0 .63-.26.82l-1.25.92a1.38 1.38 0 0 0 0 2.22l1.25.92c.26.19.36.52.27.82a10 10 0 0 1-2.2 3.8.75.75 0 0 1-.85.17l-1.4-.62a1.38 1.38 0 0 0-1.93 1.12l-.17 1.52a.75.75 0 0 1-.58.65 9.5 9.5 0 0 1-4.4 0 .75.75 0 0 1-.57-.65l-.17-1.52a1.38 1.38 0 0 0-1.93-1.11l-1.4.62a.75.75 0 0 1-.85-.18 10 10 0 0 1-2.2-3.8c-.1-.3 0-.63.26-.82l1.25-.92a1.38 1.38 0 0 0 0-2.22l-1.24-.92a.75.75 0 0 1-.28-.82 10 10 0 0 1 2.2-3.8c.23-.23.57-.3.86-.17l1.4.62c.4.17.86.15 1.25-.08.38-.22.63-.6.68-1.04l.17-1.53a.75.75 0 0 1 .58-.65q1.08-.24 2.2-.25M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6"/>
                  </svg>
               </label>
            </header>

            <main class="relative z-10 flex flex-1 items-center justify-center px-4 pb-24 sm:px-6">
               <section id="birthday-form" hidden class="w-full max-w-sm">
                  <div class="card-surface p-6 sm:p-8">
                     <div class="badge-icon mb-5 flex size-14 items-center justify-center">
                        <svg viewBox="0 0 24 24" class="not-microsoft size-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                           <rect x="3" y="5" width="18" height="16" rx="3"/>
                           <path d="M3 10h18M8 3v4M16 3v4"/>
                        </svg>
                        <svg viewBox="0 0 24 24" class="only-microsoft size-7" fill="currentColor">
                           <path d="M17.75 3C19.55 3 21 4.46 21 6.25v11.5c0 1.8-1.46 3.25-3.25 3.25H6.25A3.25 3.25 0 0 1 3 17.75V6.25C3 4.45 4.46 3 6.25 3zm1.75 5.5h-15v9.25c0 .97.78 1.75 1.75 1.75h11.5c.97 0 1.75-.78 1.75-1.75zm-11.75 6a1.25 1.25 0 1 1 0 2.5 1.25 1.25 0 0 1 0-2.5m4.25 0a1.25 1.25 0 1 1 0 2.5 1.25 1.25 0 0 1 0-2.5m-4.25-4a1.25 1.25 0 1 1 0 2.5 1.25 1.25 0 0 1 0-2.5m4.25 0a1.25 1.25 0 1 1 0 2.5 1.25 1.25 0 0 1 0-2.5m4.25 0a1.25 1.25 0 1 1 0 2.5 1.25 1.25 0 0 1 0-2.5m1.5-6H6.25c-.97 0-1.75.78-1.75 1.75V7h15v-.75c0-.97-.78-1.75-1.75-1.75"/>
                        </svg>
                     </div>
                     <h1 class="headline">When were you born?</h1>
                     <p class="supporting mt-2">Your birthday stays on this device and is only used to count your time.</p>
                     <form id="birthday-input-form" class="mt-7 flex flex-col gap-3">
                        <input id="birthday-input" type="date" required aria-label="Birthday" class="field w-full">
                        <button type="submit" class="cta">Continue</button>
                     </form>
                  </div>
               </section>

               <section id="birthday-timer" hidden class="text-center">
                  <p class="eyebrow">Your age</p>
                  <div class="mt-3 flex max-w-full items-baseline justify-center tabular-nums">
                     <span id="age-years" class="age-years"></span>
                     <span id="age-fraction" class="age-fraction"></span>
                  </div>
                  <p class="tagline mt-6">Make every moment count.</p>
               </section>
            </main>
         </div>

         <div class="drawer-side z-20">
            <label for="settings-drawer" aria-label="Close settings" class="drawer-overlay"></label>
            <aside id="settings-panel" class="panel relative m-3 flex h-[calc(100%-1.5rem)] w-[min(360px,calc(100vw-1.5rem))] flex-col overflow-y-auto overscroll-contain p-5 [&>*]:shrink-0">
               <div class="-mt-3 flex h-8 items-center px-1 pr-10">
                  <h2 class="panel-title">Settings</h2>
               </div>
               <label for="settings-drawer" aria-label="Close settings" class="icon-btn close-btn absolute top-2 right-3">
                  <svg viewBox="0 0 24 24" class="only-apple size-3.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
                     <path d="M6 6l12 12M18 6L6 18"/>
                  </svg>
                  <svg viewBox="0 0 24 24" class="only-google size-6" fill="currentColor">
                     <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                  </svg>
                  <svg viewBox="0 0 20 20" class="only-microsoft size-4" fill="currentColor">
                     <path d="m4.09 4.22.06-.07a.5.5 0 0 1 .63-.06l.07.06L10 9.29l5.15-5.14a.5.5 0 0 1 .63-.06l.07.06c.18.17.2.44.06.63l-.06.07L10.71 10l5.14 5.15c.18.17.2.44.06.63l-.06.07a.5.5 0 0 1-.63.06l-.07-.06L10 10.71l-5.15 5.14a.5.5 0 0 1-.63.06l-.07-.06a.5.5 0 0 1-.06-.63l.06-.07L9.29 10 4.15 4.85a.5.5 0 0 1-.06-.63l.06-.07z"/>
                  </svg>
               </label>

               <p class="section-label mt-6">Appearance</p>
               <div class="group">
                  <div class="row">
                     <label for="design-select">Design</label>
                     <div class="select-wrap">
                        <select id="design-select" class="select-field">
                           <option value="apple">Apple</option>
                           <option value="google">Google</option>
                           <option value="microsoft">Microsoft</option>
                        </select>
                        <svg viewBox="0 0 24 24" class="select-chevron only-apple" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 9.5l4-4 4 4M8 14.5l4 4 4-4"/></svg>
                        <svg viewBox="0 0 24 24" class="select-chevron only-google" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg>
                        <svg viewBox="0 0 16 16" class="select-chevron only-microsoft" fill="currentColor"><path d="M3.15 5.65c.2-.2.5-.2.7 0L8 9.79l4.15-4.14a.5.5 0 0 1 .7.7l-4.5 4.5a.5.5 0 0 1-.7 0l-4.5-4.5a.5.5 0 0 1 0-.7"/></svg>
                     </div>
                  </div>
               </div>

               <p class="section-label mt-6">Timer</p>
               <div class="group">
                  <div class="row-block">
                     <div class="flex items-center justify-between">
                        <label for="update-tick-range">Refresh interval</label>
                        <span class="row-value tabular-nums"><span id="update-tick-value"></span> ms</span>
                     </div>
                     <input id="update-tick-range" type="range" min="10" max="1000" step="10" class="tick-range mt-3 w-full">
                     <div class="hint mt-1.5 flex justify-between">
                        <span>Faster</span>
                        <span>Slower</span>
                     </div>
                  </div>
               </div>

               <p class="section-label mt-6">Profile</p>
               <div class="group">
                  <div class="row">
                     <span>Birthday</span>
                     <span id="birthday-value" class="row-value">Not set</span>
                  </div>
                  <div class="row-divider"></div>
                  <button id="reset-birthday" type="button" class="row row-action w-full text-left">Change Birthday</button>
               </div>

               <div class="min-h-6 flex-1 !shrink"></div>
               <div class="group">
                  <a href="https://github.com/aysommer/inspiration-page" target="_blank" rel="noopener" class="row row-link">
                     <span>Source Code</span>
                     <svg viewBox="0 0 24 24" class="size-4 opacity-40" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 6l6 6-6 6"/>
                     </svg>
                  </a>
               </div>
            </aside>
         </div>
      </div>
      <script type="module" src="/src/main.js"></script>
   </body>
</html>
